name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: fastmcp inspect mcp_server.py:mcp
      - name: Live GitHub auth / MCP smoke
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN_FOR_TEST: ${{ github.token }}
        run: |
          python - <<'PY'
          import asyncio
          import json
          from fastmcp import Client
          from mcp_server import mcp

          async def main():
              async with Client(mcp) as client:
                  import os
                  os.environ["APIKEY_GITHUB"] = json.dumps({
                      "key": os.environ["GITHUB_TOKEN_FOR_TEST"],
                      "desc": "GitHub API read-only workflow token",
                  })
                  result = await client.call_tool("list_env", {})
                  assert "GITHUB_TOKEN_FOR_TEST" not in result.content[0].text
                  assert "APIKEY_GITHUB" in result.content[0].text
                  result = await client.call_tool("http_request", {
                      "method": "GET",
                      "url": "https://api.github.com/repos/ReallocAll/freedo",
                      "headers": {"Authorization": "Bearer {{env:APIKEY_GITHUB}}"}
                  })
                  assert not result.is_error
                  payload = json.loads(result.content[0].text)
                  assert payload["status_code"] == 200, payload
                  assert payload["body_format"] == "json"
                  assert payload["body"]["private"] is True
                  assert "headers" not in payload
                  assert result.structured_content is None
                  print("Live authenticated GitHub API MCP roundtrip succeeded")

          asyncio.run(main())
          PY
