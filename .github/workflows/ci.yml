name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: fastmcp inspect server.py:mcp
      - name: Live public HTTP / MCP smoke
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import asyncio
          import json
          from fastmcp import Client
          from server import mcp

          async def main():
              async with Client(mcp) as client:
                  result = await client.call_tool("http_request", {
                      "method": "GET",
                      "url": "https://api.github.com/zen"
                  })
                  assert not result.is_error
                  payload = json.loads(result.content[0].text)
                  assert payload["status_code"] == 200, payload
                  assert payload["body"]
                  print("Live GitHub API roundtrip succeeded")

          asyncio.run(main())
          PY
