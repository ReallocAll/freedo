[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "freedo"
version = "0.1.1"
description = "Provider-agnostic HTTP API MCP for trusted agents"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.6",
    "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools]
py-modules = ["server", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
